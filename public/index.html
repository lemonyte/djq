        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Song Requests</title>
        <link rel="stylesheet" href="/style.css" />

    <body>
        <main>
            <h1>🎧 Song Requests</h1>
            <p>
                Let your guests scan a QR code to see what's playing, request songs and upvote them. You pick which

            </p>

            </p>
        </main>
