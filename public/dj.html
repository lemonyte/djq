<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>DJ Room · DJ Console</title>
        <link rel="stylesheet" href="/style.css" />
        <link id="manifest" rel="manifest" />
        <style>
            /* Phones: equal-width buttons with the icon above the label. Wider screens: one row of pills. */
            .toolbar {
                display: flex;
                gap: 8px;
            }
            .toolbar button {
                flex: 1 1 0;
                min-width: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 4px;
                min-height: 64px;
                padding: 8px 6px;
                border-radius: 12px;
                font-size: 0.85rem;
                line-height: 1.2;
            }
            .toolbar svg {
                width: 22px;
                height: 22px;
                flex: none;
            }
            @media (min-width: 520px) {
                .toolbar {
                    flex-wrap: wrap;
                }
                .toolbar button {
                    flex: none;
                    flex-direction: row;
                    min-height: 40px;
                    padding: 8px 16px;
                    border-radius: 999px;
                    font-size: 1rem;
                }
                .toolbar svg {
                    width: 18px;
                    height: 18px;
                }
            }

            .push {
                margin: 20px 0 0;
            }
            .push .hint {
                margin: 0;
                font-size: 0.9em;
            }
            .hint {
                color: var(--muted);
            }

            #reset {
                margin-bottom: 8px;
            }

            dialog {
                width: min(100% - 32px, 420px);
                max-height: calc(100% - 32px);
                padding: 0;
                border: 0;
                border-radius: 16px;
                background: var(--card);
                color: var(--fg);
            }
            dialog::backdrop {
                background: rgb(0 0 0 / 0.6);
            }
            /* Padding lives on the inner div, so a click that lands on the dialog itself is a backdrop click */
            .dialog-body {
                padding: 16px;
            }
            .dialog-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                margin-bottom: 16px;
            }
            .dialog-head h2 {
                margin: 0;
            }
            .close {
                width: 40px;
                padding: 0;
                flex: none;
            }

            #qr {
                width: fit-content;
                margin: 0 auto;
                padding: 12px;
                border-radius: 8px;
                background: #fff;
            }
            #qr img {
                display: block;
                width: 100%;
                max-width: 240px;
                height: auto;
            }
            #url {
                margin: 12px 0 0;
                text-align: center;
                color: var(--muted);
                font-size: 0.85em;
                overflow-wrap: anywhere;
            }

            .field {
                display: flex;
                flex-direction: column;
                gap: 6px;
                margin-bottom: 16px;
            }
            .field input[type="text"] {
                font: inherit;
                padding: 10px 12px;
                border-radius: 8px;
                border: 1px solid #333;
                background: var(--bg);
                color: var(--fg);
            }
            .check {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .check input {
                width: 20px;
                height: 20px;
                flex: none;
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <h1 id="title">DJ Room</h1>
                <p class="subtitle">DJ Console</p>
            </header>

            <p id="loginHint" class="hint" hidden>Log in with this room's Spotify account to DJ.</p>

            <nav class="toolbar" aria-label="DJ controls">
                <button id="spotify" type="button" disabled>
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5" />
                        <path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5" />
                    </svg>
                    <span id="spotifyLabel">Connect Spotify</span>
                </button>
                <button id="showQr" class="secondary" type="button" aria-haspopup="dialog">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <rect x="3" y="3" width="7" height="7" rx="1" />
                        <rect x="14" y="3" width="7" height="7" rx="1" />
                        <rect x="3" y="14" width="7" height="7" rx="1" />
                        <path d="M14 14h3v3h-3zM21 14v.01M14 21h.01M17 21h4v-4" />
                    </svg>
                    <span>Show QR</span>
                </button>
                <button id="showSettings" class="secondary" type="button" aria-haspopup="dialog">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M4 6h16M4 12h16M4 18h16" />
                        <circle cx="9" cy="6" r="2" fill="currentColor" />
                        <circle cx="15" cy="12" r="2" fill="currentColor" />
                        <circle cx="7" cy="18" r="2" fill="currentColor" />
                    </svg>
                    <span>Settings</span>
                </button>
            </nav>

            <h2>Pending requests</h2>
            <ul id="pending"></ul>

            <h2>Now playing</h2>
            <ul id="now"></ul>
            <h2>Up next</h2>
            <ul id="queue"></ul>

            <h2>Handled</h2>
            <button id="reset" class="secondary">Clear all requests</button>
            <ul id="done"></ul>
        </main>

        <dialog id="qrDialog" aria-labelledby="qrTitle">
            <div class="dialog-body">
                <div class="dialog-head">
                    <h2 id="qrTitle">Guests scan this</h2>
                    <button class="close secondary" type="button" aria-label="Close">✕</button>
                </div>
                <div id="qr"></div>
                <p id="url"></p>
            </div>
        </dialog>

        <dialog id="settingsDialog" aria-labelledby="settingsTitle">
            <div class="dialog-body">
                <div class="dialog-head">
                    <h2 id="settingsTitle">Settings</h2>
                    <button class="close secondary" type="button" aria-label="Close">✕</button>
                </div>
                <label class="field">
                    Room name
                    <input id="roomName" type="text" maxlength="60" />
                </label>
                <label class="field">
                    Accent color
                    <input id="accent" type="color" value="#ffc23d" />
                </label>
                <label class="check">
                    <input id="autoQueue" type="checkbox" />
                    Add requests to the queue automatically
                </label>
                <div class="field push">
                    Notifications
                    <button id="push" class="secondary" type="button" hidden></button>
                    <p id="pushHint" class="hint"></p>
                </div>
            </div>
        </dialog>

        <div id="toast" role="alert"></div>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
            integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA=="
            crossorigin="anonymous"
        ></script>
        <script type="module">
            import {
                element,
                byId,
                trackItem,
                list,
                toast,
                api,
                live,
                base,
                applyRoom,
                DEFAULT_ROOM_NAME,
                iconButton,
            } from "/common.js";

            const fromHash = new URLSearchParams(location.hash.slice(1)).get("key");
            let key = fromHash;
            const stored = `djKey:${base}`; // per room, so one browser can run two rooms
            try {
                if (fromHash) {
                    localStorage[stored] = fromHash;
                }
                key ??= localStorage[stored];
            } catch {
                // storage blocked: the key from the URL still works for this visit
            }
            key ??= ""; // no key: the console asks the DJ to log in with Spotify
            if (fromHash) {
                history.replaceState(null, "", location.pathname); // keep the key out of the address bar
            }

            const guestUrl = location.origin + base;
            new QRCode(byId("qr"), { text: guestUrl, width: 240, height: 240 });
            byId("url").textContent = guestUrl;
            byId("roomName").placeholder = DEFAULT_ROOM_NAME;

            // --- modals ---
            byId("showQr").onclick = () => byId("qrDialog").showModal();
            byId("showSettings").onclick = () => byId("settingsDialog").showModal();
            for (const dialog of document.querySelectorAll("dialog")) {
                dialog.addEventListener("click", (event) => {
                    if (event.target === dialog) {
                        dialog.close(); // backdrop click
                    }
                });
                dialog.querySelector(".close").onclick = () => dialog.close();
            }

            // --- actions ---
            let connected = false;
            byId("spotify").onclick = () => {
                if (connected) {
                    api("/api/disconnect", { key }).catch((error) => toast(error.message));
                } else {
                    location.href = "/auth/login";
                }
            };

            async function act(id, what) {
                try {
                    await api(`/api/requests/${id}/${what}`, { key });
                } catch (error) {
                    toast(error.message);
                }
            }

            async function saveSetting(body) {
                try {
                    await api("/api/settings", { body, key });
                    return true;
                } catch (error) {
                    toast(error.message);
                    return false;
                }
            }
            byId("roomName").onchange = (event) => saveSetting({ name: event.target.value });
            byId("accent").onchange = (event) => saveSetting({ accent: event.target.value });
            byId("autoQueue").onchange = async (event) => {
                const checkbox = event.target;
                if (!(await saveSetting({ autoQueue: checkbox.checked }))) {
                    checkbox.checked = !checkbox.checked;
                }
            };

            // --- push notifications ---
            // The manifest lets an iPhone add this console to the Home Screen, which it needs for notifications.
            byId("manifest").href = `${base}/manifest.webmanifest?key=${encodeURIComponent(key)}`;

            let pushKey = null; // the server's public key; null when push isn't set up there
            const pushStored = `push:${base}`; // "on" when this device gets this room's notifications

            function pushIsOn() {
                try {
                    return localStorage[pushStored] === "on";
                } catch {
                    return false;
                }
            }

            function renderPush() {
                const button = byId("push");
                const hint = byId("pushHint");
                const supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
                button.hidden = !pushKey || !supported;
                hint.textContent = "";
                if (!pushKey) {
                    hint.textContent = "Notifications aren't set up on this server.";
                } else if (!supported) {
                    hint.textContent =
                        "This browser can't show notifications. On iPhone or iPad, add this page to your Home Screen " +
                        "(Share, then Add to Home Screen) and open it from there.";
                } else if (Notification.permission === "denied") {
                    button.hidden = true;
                    hint.textContent = "Notifications are blocked for this site. Allow them in your browser settings.";
                } else {
                    button.textContent = pushIsOn()
                        ? "Turn off notifications on this device"
                        : "Notify me about new requests";
                }
            }

            function base64UrlToBytes(text) {
                return Uint8Array.from(atob(text.replace(/-/g, "+").replace(/_/g, "/")), (char) => char.charCodeAt(0));
            }

            async function turnOnPush() {
                // Called straight from the click, before any other await: Safari only asks for permission inside a tap.
                if ((await Notification.requestPermission()) !== "granted") {
                    throw new Error("Notifications weren't allowed");
                }
                const registration = await navigator.serviceWorker.register("/sw.js");
                await navigator.serviceWorker.ready;
                const subscription =
                    (await registration.pushManager.getSubscription()) ??
                    (await registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: base64UrlToBytes(pushKey),
                    }));
                await api("/api/push", { body: { subscription: subscription.toJSON() }, key });
                localStorage[pushStored] = "on";
            }

            async function turnOffPush() {
                const registration = await navigator.serviceWorker.getRegistration("/");
                const subscription = await registration?.pushManager.getSubscription();
                if (subscription) {
                    // Only this room forgets the device. The browser keeps its subscription, since other rooms
                    // open in this browser may still use it.
                    await api("/api/push/remove", { body: { endpoint: subscription.endpoint }, key });
                }
                delete localStorage[pushStored];
            }

            byId("push").onclick = async () => {
                const button = byId("push");
                button.disabled = true;
                try {
                    if (pushIsOn()) {
                        await turnOffPush();
                    } else {
                        await turnOnPush();
                    }
                } catch (error) {
                    toast(error.message);
                }
                button.disabled = false;
                renderPush();
            };

            byId("reset").onclick = () => {
                if (confirm("Clear all requests and votes for a new party?")) {
                    api("/api/reset", { key }).catch((error) => toast(error.message));
                }
            };

            // --- live state ---
            function showSpotifyButton(label, primary) {
                byId("spotify").disabled = false;
                byId("spotifyLabel").textContent = label;
                byId("spotify").classList.toggle("secondary", !primary);
            }

            // shortcut: key goes in the WebSocket query string since browsers can't set headers on it
            live(`key=${encodeURIComponent(key)}`, (state) => {
                applyRoom(state.room, "DJ Console");
                const isDj = !!state.dj;
                byId("loginHint").hidden = isDj;
                byId("showQr").hidden = !isDj;
                byId("showSettings").hidden = !isDj;
                if (!isDj) {
                    // Logging in with the Spotify account that owns this room brings the key back.
                    connected = false;
                    showSpotifyButton("Log in with Spotify", true);
                    return;
                }
                connected = state.connected;
                showSpotifyButton(connected ? "Disconnect Spotify" : "Connect Spotify", !connected);
                byId("autoQueue").checked = !!state.room.autoQueue;
                pushKey = state.pushKey;
                renderPush();
                // Don't overwrite a field while the DJ is editing it.
                if (document.activeElement !== byId("roomName")) {
                    byId("roomName").value = state.room.name ?? "";
                }
                if (document.activeElement !== byId("accent")) {
                    byId("accent").value = state.room.accent ?? "#ffc23d";
                }

                list(byId("now"), state.nowPlaying ? [state.nowPlaying] : [], "Nothing playing", (track) =>
                    trackItem(track),
                );
                list(byId("queue"), state.queue, "Queue is empty", (track) => trackItem(track));
                const pending = state.requests.filter((request) => request.status === "pending");
                list(byId("pending"), pending, "No pending requests", (request) =>
                    trackItem(
                        request,
                        element("span", { class: "badge" }, `▲ ${request.votes}`),
                        element(
                            "span",
                            { class: "actions" },
                            iconButton("addToQueue", `Queue ${request.title}`, null, () => act(request.id, "approve")),
                            iconButton("reject", `Reject ${request.title}`, "danger", () => act(request.id, "reject")),
                        ),
                    ),
                );
                list(
                    byId("done"),
                    state.requests.filter((request) => request.status !== "pending"),
                    "Nothing yet",
                    (request) =>
                        trackItem(
                            request,
                            element("span", { class: "badge" }, request.status),
                            request.status === "rejected" &&
                                element(
                                    "span",
                                    { class: "actions" },
                                    iconButton("addToQueue", `Queue ${request.title} anyway`, "secondary", () =>
                                        act(request.id, "approve"),
                                    ),
                                ),
                        ),
                );
            });
        </script>
    </body>
</html>
